<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        /* Custom scrollbar for a sleeker look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* Tailwind gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; /* Tailwind gray-700 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; /* Tailwind gray-600 */
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Configuration Panel -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex-shrink-0 z-10 shadow-md">
        <div class="max-w-4xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    AI
                </div>
                <h1 class="text-xl font-semibold tracking-wide">Assistant Interface</h1>
            </div>
            
            <div class="flex items-center gap-2 text-sm w-full sm:w-auto">
                <label for="apiUrl" class="text-gray-400 whitespace-nowrap">API URL:</label>
                <input type="text" id="apiUrl" value="http://127.0.0.1:8000/chat" 
                    class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-200 w-full sm:w-64 transition-all">
            </div>
        </div>
    </header>

    <!-- Chat History Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl mx-auto w-full scroll-smooth">
        <!-- Initial Welcome Message -->
        <div class="flex flex-col items-center justify-center h-full text-center space-y-4 text-gray-400" id="emptyState">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <div>
                <p class="text-lg font-medium text-gray-300">Ready to chat</p>
                <p class="text-sm mt-1">Send a message to test the FastAPI endpoint.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 flex-shrink-0">
        <div class="max-w-4xl mx-auto w-full relative">
            <form id="chatForm" class="flex items-end gap-2">
                <div class="relative flex-1">
                    <textarea id="messageInput" rows="1" placeholder="Type your message here..."
                        class="w-full bg-gray-700 border border-gray-600 rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-100 resize-none max-h-32 transition-all block"></textarea>
                </div>
                <button type="submit" id="sendButton"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl p-3 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed h-full flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </form>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chatForm');
            const messageInput = document.getElementById('messageInput');
            const chatContainer = document.getElementById('chatContainer');
            const emptyState = document.getElementById('emptyState');
            const apiUrlInput = document.getElementById('apiUrl');
            const sendButton = document.getElementById('sendButton');

            // Generate a random thread ID for the session
            const threadId = 'thread_' + Math.random().toString(36).substring(2, 15);

            // Auto-resize textarea
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight < 128 ? this.scrollHeight : 128) + 'px';
                if(this.value.trim() === '') {
                    this.style.height = 'auto';
                }
            });

            // Submit on Enter (prevent default to avoid new line, allow Shift+Enter)
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if(this.value.trim() !== '') {
                        chatForm.dispatchEvent(new Event('submit'));
                    }
                }
            });

            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const messageText = messageInput.value.trim();
                if (!messageText) return;

                // Remove empty state if present
                if (emptyState) {
                    emptyState.style.display = 'none';
                }

                // 1. Add User Message to UI
                appendMessage('user', messageText);
                
                // Clear input
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                // 2. Add Loading Indicator
                const loadingId = appendLoadingIndicator();
                
                // Disable input while processing
                messageInput.disabled = true;
                sendButton.disabled = true;

                try {
                    const apiUrl = apiUrlInput.value.trim();
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: messageText,
                            thread_id: threadId
                        })
                    });

                    // Remove Loading indicator
                    removeMessage(loadingId);

                    if (!response.ok) {
                        // Handle standard HTTP errors
                        let errorDetail = `Error ${response.status}: ${response.statusText}`;
                        try {
                            const errJson = await response.json();
                            if (errJson.detail) {
                                errorDetail = errJson.detail;
                            }
                        } catch(e) {}
                        
                        appendSystemMessage(errorDetail, response.status === 400 ? 'warning' : 'error');
                        return;
                    }

                    const data = await response.json();
                    
                    // Note: Handling both 'response' and 'reponse' due to typo in backend code snippet provided
                    const responseText = data.response || data.reponse || "No response text received.";
                    
                    // 3. Add AI Message to UI
                    appendMessage('assistant', responseText, {
                        model: data.model_used,
                        cached: data.cached || data.chached, // handling backend typo 'chached'
                        time: data.processing_time_ms
                    });

                } catch (error) {
                    removeMessage(loadingId);
                    appendSystemMessage(`Connection Error: Make sure your FastAPI server is running at ${apiUrlInput.value}`, 'error');
                    console.error("Fetch error:", error);
                } finally {
                    // Re-enable input
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                    scrollToBottom();
                }
            });

            function appendMessage(role, text, metadata = null) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                let innerHtml = '';
                
                if (role === 'user') {
                    innerHtml = `
                        <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl px-5 py-3.5 bg-indigo-600 text-white shadow-md rounded-tr-sm">
                            <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</p>
                        </div>
                    `;
                } else if (role === 'assistant') {
                    // Build metadata badges
                    let badgesHtml = '';
                    if (metadata) {
                        badgesHtml += `<div class="flex flex-wrap gap-2 mt-3 border-t border-gray-700 pt-3">`;
                        
                        // Time badge
                        if (metadata.time !== undefined) {
                            badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-900 text-gray-400 border border-gray-700" title="Processing Time">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                ${metadata.time}ms
                            </span>`;
                        }
                        
                        // Model badge
                        if (metadata.model) {
                            badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-900/30 text-blue-400 border border-blue-800/50" title="Model Used">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                ${escapeHtml(metadata.model)}
                            </span>`;
                        }
                        
                        // Cache badge
                        if (metadata.cached) {
                            badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-900/30 text-green-400 border border-green-800/50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                Cache Hit
                            </span>`;
                        }
                        
                        badgesHtml += `</div>`;
                    }

                    innerHtml = `
                        <div class="max-w-[90%] sm:max-w-[85%] rounded-2xl px-5 py-4 bg-gray-800 border border-gray-700 text-gray-100 shadow-md rounded-tl-sm">
                            <div class="prose prose-invert max-w-none text-sm sm:text-base leading-relaxed">
                                <p class="whitespace-pre-wrap">${escapeHtml(text)}</p>
                            </div>
                            ${badgesHtml}
                        </div>
                    `;
                }

                msgDiv.innerHTML = innerHtml;
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function appendSystemMessage(text, type = 'error') {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex w-full justify-center my-4`;
                
                const bgColor = type === 'warning' ? 'bg-yellow-900/20' : 'bg-red-900/20';
                const borderColor = type === 'warning' ? 'border-yellow-700/50' : 'border-red-700/50';
                const textColor = type === 'warning' ? 'text-yellow-400' : 'text-red-400';
                const icon = type === 'warning' 
                    ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />`
                    : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />`;

                msgDiv.innerHTML = `
                    <div class="${bgColor} border ${borderColor} rounded-lg px-4 py-2 flex items-center gap-3 text-sm max-w-[85%] shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${textColor} flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            ${icon}
                        </svg>
                        <span class="${textColor}">${escapeHtml(text)}</span>
                    </div>
                `;
                
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function appendLoadingIndicator() {
                const id = 'loading_' + Date.now();
                const msgDiv = document.createElement('div');
                msgDiv.id = id;
                msgDiv.className = `flex w-full justify-start`;
                msgDiv.innerHTML = `
                    <div class="max-w-[85%] rounded-2xl px-5 py-4 bg-gray-800 border border-gray-700 text-gray-400 shadow-md rounded-tl-sm flex items-center gap-2">
                        <span class="text-sm font-medium">Assistant is typing</span>
                        <div class="typing-indicator flex gap-1 ml-1 mt-1">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
                return id;
            }

            function removeMessage(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.remove();
                }
            }

            function scrollToBottom() {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }

            // Simple HTML escape to prevent XSS
            function escapeHtml(unsafe) {
                if (typeof unsafe !== 'string') return unsafe;
                return unsafe
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }
        });
    </script>
</body>
</html>
